- Class: text
  Output: This is Rosling's chart for one year. Four columns of the table are on the page at once, as position, position, colour and size. Each was a choice, and each choice is a claim about what matters.
- Class: text
  Output: So far, one year. The question that matters for policy is whether the picture changed. A second plot beside the first is the grammar's way to compare, and it needs two years in one table.
- Class: cmd_question
  Output: Keep two years, 1962 and 2012, in a new object called g2. filter() again, but a row is kept when its year is in a list of two, and the operator for that is %in%, so the condition reads year %in% c(1962, 2012). Write the whole line yourself.
  CorrectAnswer: g2 <- filter(gapminder, year %in% c(1962, 2012))
  AnswerTests: any_of_exprs('g2 <- filter(gapminder, year %in% c(1962, 2012))', 'g2 <- gapminder %>% filter(year %in% c(1962, 2012))', 'g2 <- filter(gapminder, year == 1962 | year == 2012)')
  Hint: g2 <- filter(gapminder, year %in% c(1962, 2012)) with %in% between year and c(...).
- Class: text
  Output: The layer that does this is facet_wrap(). A facet is one panel. facet_wrap() takes a column and draws the whole plot once for every value in that column, side by side, with the same axes in each panel. It is written with a tilde, the ~ key, in front of the column name, facet_wrap(~ year), which reads as panels by year. It goes on the end of the plot with another plus sign, like any layer.
- Class: cmd_question
  Output: Draw one panel per year. The plot of g2 with x = fertility, y = life_expectancy and colour = continent inside aes(), geom_point(), and then the facet layer after one more plus sign.
  CorrectAnswer: ggplot(g2, aes(x = fertility, y = life_expectancy, colour = continent)) + geom_point() + facet_wrap(~ year)
  AnswerTests: any_of_exprs('ggplot(g2, aes(x = fertility, y = life_expectancy, colour = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(data = g2, mapping = aes(x = fertility, y = life_expectancy, colour = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(g2, mapping = aes(x = fertility, y = life_expectancy, colour = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(data = g2, aes(x = fertility, y = life_expectancy, colour = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(g2, aes(x = fertility, y = life_expectancy, color = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(data = g2, mapping = aes(x = fertility, y = life_expectancy, color = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(g2, mapping = aes(x = fertility, y = life_expectancy, color = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(data = g2, aes(x = fertility, y = life_expectancy, color = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(g2, aes(fertility, life_expectancy, colour = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(data = g2, mapping = aes(fertility, life_expectancy, colour = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(g2, mapping = aes(fertility, life_expectancy, colour = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(data = g2, aes(fertility, life_expectancy, colour = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(g2, aes(fertility, life_expectancy, color = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(data = g2, mapping = aes(fertility, life_expectancy, color = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(g2, mapping = aes(fertility, life_expectancy, color = continent)) + geom_point() + facet_wrap(~ year)', 'ggplot(data = g2, aes(fertility, life_expectancy, color = continent)) + geom_point() + facet_wrap(~ year)')
  Hint: Add + facet_wrap(~ year) at the end. The ~ is the tilde key.
- Class: text
  Output: Two panels, same axes, so the comparison is fair. In 2012 most of the world has moved to the top left. Africa has moved too, up and to the left, and is still furthest right. On the averages, fertility in Africa went from 6.6 to 4.5 births per woman, in Europe from 2.8 to 1.6; life expectancy in Africa from 44 to 62. Whether that is one world or still two is a reading, and the lab will ask you to defend yours.
- Class: text
  Output: That is the grammar's way of adding a variable without adding an aesthetic. Colour put continent on the page; the facet put year on the page; and it turned a description into a comparison.
- Class: text
  Output: Now a different geom, for a different kind of claim. A change over time, Session 7's subject. One country first.
- Class: cmd_question
