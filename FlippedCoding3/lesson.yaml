  CorrectAnswer: setwd("the path to your module folder")
  AnswerTests: expr_uses_func("setwd")
  Hint: Files pane, bottom right. Browse to your module folder, open it, then the cog, then Set As Working Directory. Or type it yourself, for example setwd("~/Documents/STEP0020") on a Mac, with your own folder name in the quotes.
