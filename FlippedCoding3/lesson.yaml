  Output: Look at the first six rows.
  CorrectAnswer: head(gapminder)
  AnswerTests: omnitest(correctExpr='head(gapminder)')
  Hint: head(gapminder), the table name inside the brackets.
- Class: text
  Output: Albania in 1960, Algeria in 1960, and so on. The file is sorted by year, then country, so head() shows you 1960 only. Two NA in the first six rows already; the gaps are part of the data, as they were on the Titanic.
- Class: text
  Output: Now the question the lab will work on. In the 1960s it was common to describe the world as two worlds, a developed West with small families and long lives, and a developing rest with large families and short lives. Does the 1962 data show two worlds? To look, you need one year, and that is a dplyr job before it is a graph job.
- Class: cmd_question
  Output: Keep the 1962 rows only, in a new object called g1962. You met the verb for keeping rows in the last lesson; remember that a comparison takes two equals signs. Have a go before you look at the hint.
  CorrectAnswer: g1962 <- filter(gapminder, year == 1962)
  AnswerTests: any_of_exprs('g1962 <- filter(gapminder, year == 1962)', 'g1962 <- gapminder %>% filter(year == 1962)', 'g1962 <- filter(gapminder, year == 1962L)')
  Hint: g1962 <- filter(gapminder, year == 1962) with a double equals sign.
- Class: cmd_question
  Output: Check its size.
  CorrectAnswer: dim(g1962)
  AnswerTests: omnitest(correctExpr='dim(g1962)')
  Hint: dim(g1962), the new table's name inside the brackets.
- Class: text
  Output: 185 rows and 9 columns, one row per country. Every graph you draw in the next ten minutes is a picture of this table.
- Class: text
  Output: The grammar. Every graph answers three questions. Which table is it drawn from (the data)? Which column goes to which visual property, such as the horizontal position, the vertical position, the colour, the size (the mapping, from variables to aesthetics)? And what mark is drawn for each row, a point, a line, a bar (the geom)? ggplot2 asks you exactly those three things, in that order.
- Class: text
  Output: The template is ggplot(data, aes(mapping)) + geom_something(). ggplot() names the data and draws nothing. aes() holds the mapping. The geom draws. The parts are joined with a plus sign, not with the pipe. Type the whole thing on one line in this lesson.
- Class: cmd_question
  Output: Draw it. Fill the template in. The data is g1962; inside aes(), x = fertility and y = life_expectancy; the geom is geom_point(). Write the line, press Enter, and look at the Plots pane.
  CorrectAnswer: ggplot(g1962, aes(x = fertility, y = life_expectancy)) + geom_point()
  AnswerTests: any_of_exprs('ggplot(g1962, aes(x = fertility, y = life_expectancy)) + geom_point()', 'ggplot(data = g1962, mapping = aes(x = fertility, y = life_expectancy)) + geom_point()', 'ggplot(g1962, mapping = aes(x = fertility, y = life_expectancy)) + geom_point()', 'ggplot(data = g1962, aes(x = fertility, y = life_expectancy)) + geom_point()', 'ggplot(g1962, aes(fertility, life_expectancy)) + geom_point()', 'ggplot(data = g1962, mapping = aes(fertility, life_expectancy)) + geom_point()', 'ggplot(g1962, mapping = aes(fertility, life_expectancy)) + geom_point()', 'ggplot(data = g1962, aes(fertility, life_expectancy)) + geom_point()')
  Hint: ggplot(g1962, aes(x = fertility, y = life_expectancy)) + geom_point() with a plus sign before geom_point.
- Class: text
  Output: 185 points, one per country. Read it before you believe it. Fertility runs along the bottom from about two to eight births per woman; life expectancy up the side from about thirty years to the mid seventies. Is there a gap between a cluster at the top left and a cluster at the bottom right, or a continuous spread? The lowest point is Mali, at thirty years; the highest is Iceland, at seventy-four.
- Class: cmd_question
  Output: Now see what each part does by leaving one out. Write the same line without the geom, so it ends at the closing bracket of aes().
  CorrectAnswer: ggplot(g1962, aes(x = fertility, y = life_expectancy))
  AnswerTests: any_of_exprs('ggplot(g1962, aes(x = fertility, y = life_expectancy))', 'ggplot(data = g1962, mapping = aes(x = fertility, y = life_expectancy))', 'ggplot(g1962, mapping = aes(x = fertility, y = life_expectancy))', 'ggplot(data = g1962, aes(x = fertility, y = life_expectancy))', 'ggplot(g1962, aes(fertility, life_expectancy))', 'ggplot(data = g1962, mapping = aes(fertility, life_expectancy))', 'ggplot(g1962, mapping = aes(fertility, life_expectancy))', 'ggplot(data = g1962, aes(fertility, life_expectancy))')
  Hint: The same command as before, without the + geom_point() at the end.
- Class: text
  Output: Axes, a grid, the right ranges, and nothing drawn. ggplot() and aes() set up the frame; the geom puts the marks in it. That is the whole grammar in one blank picture. Each plus sign adds a layer on top of what is there.
- Class: text
  Output: The first plot cannot say who is who. The grammar's answer is to map another column to another aesthetic. Colour is the usual choice for a column of categories, and continent is one.
