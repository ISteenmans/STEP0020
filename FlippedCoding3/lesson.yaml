- Class: text
  Output: A legend appeared by itself, because you mapped a variable. Europe sits top left; Africa bottom right; the Americas and Asia are spread between. The two-worlds description is, in 1962, roughly a description of continents, and the exceptions are now visible as points of the wrong colour in the wrong corner. The mapping decided what the plot could show you. Change the mapping and you change what can be seen.
- Class: text
  Output: Mapping is not the same as setting. Inside aes(), colour = continent means let the colour vary with the continent column. Outside aes(), colour = "red" means make every point red. One is a claim about the data; the other is a choice of ink.
