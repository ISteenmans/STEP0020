  Output: The moves. filter() to get the table you want, then ggplot() to name it, aes() to map columns to position, colour and size, a geom to choose the mark, a plus sign for every layer, facet_wrap() to compare panels, labs() to speak to the reader, ggsave() to keep it. Every plot in the lab is those moves in some order.
