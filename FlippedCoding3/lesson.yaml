- Class: text
  Output: What the columns hold. fertility is births per woman. life_expectancy is years, at birth. population is people. gdp is in dollars, the whole economy, and is missing for many country-years. infant_mortality is deaths per 1,000 live births, also with gaps. continent and region are the Gapminder groupings. One row is one country in one year.
