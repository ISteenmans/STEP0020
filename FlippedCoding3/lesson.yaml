- Class: text
  Output: In this lesson you learn to draw a graph from data in R with ggplot2, a package written by Hadley Wickham. It is built on an idea called the grammar of graphics, from Leland Wilkinson, which says that every graph, however elaborate, is made from the same few parts. Learn the parts once and you can build any graph.
- Class: text
  Output: The data is gapminder.csv. It comes from the Gapminder Foundation, the Swedish organisation behind Hans Rosling's moving bubble charts, as packaged for teaching by Rafael Irizarry. Rosling's charts became famous for one claim. Each country is a bubble, placed by income and life expectancy and sized by population; run the years forward and the bubbles that sat in two separate clumps in the 1960s, a rich long-lived West and a poor short-lived rest, drift into one continuous spread. The two worlds became one. You will draw a still from that film today, and the lab on Thursday asks whether his claim holds. 185 countries, every year from 1960 to 2016, with fertility, life expectancy, population, GDP and infant mortality for each.
- Class: text
  Output: One rule for this lesson. Steps describe what to do and name the pieces; they do not show you the finished line. Write it yourself. A wrong attempt is not a problem, it gets you a hint with more detail; a second wrong attempt and you can type skip() to see the answer and move on. The point is the writing, not the copying.
- Class: text
  Output: As in the last lesson, R can only open a file it can find, and it looks in one folder at a time, the working directory. Set it first, with the mouse, in the Files pane at the bottom right. Browse to your module folder (the three dots if you need to), open it, then click the cog and choose Set As Working Directory.
- Class: cmd_question
